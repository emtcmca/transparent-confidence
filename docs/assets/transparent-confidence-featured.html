<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600;700;800&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  :root {
    --bg: #0a0b0f; --panel: #10131a; --line: #232936; --ink: #eef1f6;
    --dim: #99a1b2; --faint: #656d7d; --accent: #ff2f86; --pass: #3fd07a;
  }
  #frame {
    width: 1280px; height: 640px;
    background: radial-gradient(720px 520px at 50% 40%, #1a1220 0%, var(--bg) 62%), var(--bg);
    color: var(--ink); font-family: 'JetBrains Mono', monospace;
    position: relative; overflow: hidden;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    text-align: center; padding: 56px;
  }
  #frame::before {
    content: ""; position: absolute; inset: 0;
    background-image:
      linear-gradient(rgba(255,255,255,0.016) 1px, transparent 1px),
      linear-gradient(90deg, rgba(255,255,255,0.016) 1px, transparent 1px);
    background-size: 48px 48px; pointer-events: none;
  }
  /* center-safe zone: everything lives inside ~760px wide, square-crop resilient */
  .core { position: relative; z-index: 2; width: 780px; display: flex; flex-direction: column; align-items: center; }

  .toptag {
    display: flex; align-items: center; gap: 10px; justify-content: center;
    font-size: 14px; color: var(--dim); margin-bottom: 26px;
  }
  .toptag .dot { width: 10px; height: 10px; border-radius: 50%; background: var(--accent); box-shadow: 0 0 10px var(--accent); }
  .toptag .pill { border: 1px solid var(--line); border-radius: 5px; padding: 3px 10px; font-size: 12.5px; color: var(--dim); }

  h1 { font-size: 82px; font-weight: 800; letter-spacing: -3px; line-height: 0.98; }
  h1 .accent { color: var(--accent); text-shadow: 0 0 34px rgba(255,47,134,0.55); }
  .tagline { font-family: 'Inter', sans-serif; font-size: 27px; font-weight: 500; color: var(--dim); margin-top: 20px; }

  .confbar {
    margin-top: 34px; display: flex; align-items: center; gap: 18px;
    background: var(--panel); border: 1px solid var(--line); border-radius: 12px;
    padding: 16px 26px;
  }
  .confbar .score { font-size: 46px; font-weight: 800; color: var(--accent); letter-spacing: -1.5px; text-shadow: 0 0 26px rgba(255,47,134,0.5); line-height: 1; }
  .confbar .of { font-size: 15px; color: var(--faint); }
  .confbar .divider { width: 1px; height: 42px; background: var(--line); }
  .confbar .dims { display: flex; gap: 10px; }
  .confbar .b { width: 9px; height: 40px; border-radius: 3px; background: linear-gradient(180deg, #ff64a6, #ff2f86); box-shadow: 0 0 10px rgba(255,47,134,0.6); }
  .confbar .b.d1 { height: 40px; } .confbar .b.d2 { height: 34px; } .confbar .b.d3 { height: 30px; }
  .confbar .b.d4 { height: 38px; } .confbar .b.d5 { height: 32px; } .confbar .b.d6 { height: 37px; } .confbar .b.d7 { height: 35px; } .confbar .b.d8 { height: 31px; }
  .confbar .caption { font-family: 'Inter', sans-serif; font-size: 13px; color: var(--faint); text-align: left; }
  .confbar .caption b { color: var(--dim); font-weight: 600; }

  .proofrow { margin-top: 30px; display: flex; align-items: center; gap: 22px; font-size: 15px; color: var(--ink); font-weight: 500; }
  .proofrow .it { display: flex; align-items: center; gap: 8px; }
  .proofrow .mk { color: var(--pass); font-weight: 700; }
  .proofrow .sep { color: var(--line); }

  .repo { margin-top: 32px; font-size: 16px; color: var(--faint); }
  .repo .at { color: var(--accent); font-weight: 600; }
</style>
</head>
<body>
  <div id="frame">
    <div class="core">
      <div class="toptag">
        <span class="dot"></span>
        <span class="pill">npm</span>
        <span class="pill">Apache-2.0</span>
        <span class="pill">zero deps</span>
      </div>

      <h1>transparent-<span class="accent">confidence</span></h1>
      <div class="tagline">Explainable confidence scoring for RAG.</div>

      <div class="confbar">
        <span class="score">87</span>
        <span class="of">/100</span>
        <span class="divider"></span>
        <div class="dims">
          <span class="b d1"></span><span class="b d2"></span><span class="b d3"></span><span class="b d4"></span><span class="b d5"></span><span class="b d6"></span><span class="b d7"></span><span class="b d8"></span>
        </div>
        <span class="caption"><b>8 dimensions</b><br>not one blended number</span>
      </div>

      <div class="proofrow">
        <span class="it"><span class="mk">&#10003;</span>412 tests</span>
        <span class="sep">&middot;</span>
        <span class="it"><span class="mk">&#10003;</span>95% coverage</span>
        <span class="sep">&middot;</span>
        <span class="it"><span class="mk">&#10003;</span>Node 20/22/24 CI</span>
      </div>

      <div class="repo">github.com/emtcmca/<span class="at">transparent-confidence</span></div>
    </div>
  </div>
</body>
</html>
